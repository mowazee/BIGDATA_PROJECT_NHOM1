version: "3.8"

services:
  # 1. MySQL Database (Lưu dữ liệu cào về từ Selenium/Scrapy)
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - ./shared_data:/var/lib/mysql-files

  # 2. Hadoop NameNode (Quản lý HDFS)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - ./shared_data:/shared_data
      - ./mapreduce_code:/mapreduce_code
      # Sqoop 1.4.7 (kèm mysql-connector) lưu trên máy -> không mất khi tạo lại container
      - ./tools/sqoop:/opt/sqoop
    environment:
      - CLUSTER_NAME=bigdata_ecommerce
      # Job MapReduce gửi từ namenode chạy trên YARN -> hiện ở http://localhost:8088
      - MAPRED_CONF_mapreduce_framework_name=yarn
      - MAPRED_CONF_yarn_app_mapreduce_am_env=HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1
      - MAPRED_CONF_mapreduce_map_env=HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1
      - MAPRED_CONF_mapreduce_reduce_env=HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1
      # Biến môi trường cho Sqoop (thay cho việc sửa ~/.bashrc trong container)
      - SQOOP_HOME=/opt/sqoop
      - PATH=/opt/hadoop-3.2.1/bin/:/opt/sqoop/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    env_file:
      - ./hadoop.env

  # 3. Hadoop DataNode (Lưu trữ dữ liệu thực tế)
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env

  # 4. YARN ResourceManager (Quản lý tài nguyên chạy MapReduce)
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    ports:
      - "8088:8088"
    depends_on:
      - namenode
      - datanode
    env_file:
      - ./hadoop.env

  # 5. YARN NodeManager
  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    depends_on:
      - resourcemanager
    env_file:
      - ./hadoop.env

  # 6. Postgres (Lưu trữ Metadata riêng cho Hive)
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql

  # 7. Hive Metastore
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./hadoop.env
    command: /opt/hive/bin/hive --service metastore
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql
    ports:
      - "9083:9083"

  # 8. Apache Hive Server (Truy vấn HQL)
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    env_file:
      - ./hadoop.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
      # Truy vấn Hive (GROUP BY, JOIN, INSERT...) chạy MapReduce trên YARN -> hiện ở http://localhost:8088
      # (mặc định không khai báo nên Hive chạy LocalJobRunner ngay trong container hive-server)
      MAPRED_CONF_mapreduce_framework_name: "yarn"
      MAPRED_CONF_yarn_app_mapreduce_am_env: "HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1"
      MAPRED_CONF_mapreduce_map_env: "HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1"
      MAPRED_CONF_mapreduce_reduce_env: "HADOOP_MAPRED_HOME=/opt/hadoop-3.2.1"
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
      - "10002:10002"

  # 9. Apache Spark Master (Công cụ mở rộng lấy điểm ngoài chương trình)
  spark-master:
    image: bde2020/spark-master:3.0.0-hadoop3.2
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    env_file:
      - ./hadoop.env

  # 10. Apache Hue (Giao diện Web UI quản lý HDFS & Hive trực quan)
  hue:
    image: gethue/hue:latest
    container_name: hue
    ports:
      - "8888:8888"
    volumes:
      # Cấu hình Hue dùng MySQL (mysql-db) thay vì SQLite -> hết lỗi "database is locked"
      - ./hue_conf/z-hue-overrides.ini:/usr/share/hue/desktop/conf/z-hue-overrides.ini
    depends_on:
      - namenode
      - hive-server
      - mysql-db

  # 11. Apache Kafka (công cụ ngoài chương trình): truyền dữ liệu sản phẩm dạng luồng (streaming)
  #     Chế độ KRaft 1 node, không cần ZooKeeper. Trong mạng docker: kafka:9092 ; từ Windows: localhost:9094
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - ./kafka:/kafka_demo

  # 12. Apache Zeppelin (công cụ ngoài chương trình): notebook web truy vấn Hive & vẽ biểu đồ
  #     Giao diện: http://localhost:8081 (cổng 8080 đã dùng cho Spark)
  zeppelin:
    image: apache/zeppelin:0.11.1
    container_name: zeppelin
    ports:
      - "8081:8080"
    environment:
      ZEPPELIN_NOTEBOOK_DIR: /notebook
      # Lưu notebook dạng file thường (mặc định Zeppelin tự tạo repo git bên trong thư mục notebook,
      # làm git của project không thêm được file notebook vào)
      ZEPPELIN_NOTEBOOK_STORAGE: org.apache.zeppelin.notebook.repo.VFSNotebookRepo
      ZEPPELIN_MEM: "-Xmx1024m"
    volumes:
      - ./zeppelin/notebook:/notebook
      - ./shared_data:/shared_data
    depends_on:
      - hive-server